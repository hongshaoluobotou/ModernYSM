// Fabric 加载器模块。共享源码仍放在 common/ 目录（保持 1.20.1 时代的目录结构），
// 这里只把 common + fabric + compat-stubs 三个源码目录映射到本模块的 main 源码集。
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_name
}

repositories {
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
		content {
			includeGroup "com.github.OpenYSM"
			includeGroup "com.github.TartaricAlkaline"
		}
	}
	maven {
		name = "Ladysnake"
		url = "https://maven.ladysnake.org/releases"
	}
	flatDir {
		dirs rootProject.file('libs')
	}
}

loom {
	mods {
		"yes_steve_model" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs '../common/src/main/java', 'src/main/java',
					// compat 编译存根（真实现被排除期间使用，恢复 compat 时删除此行）
					'../compat-stubs/src/main/java'
			// relativePath 使用 Gradle 的统一分隔符；不要用平台相关的 absolutePath 字符串。
			// 旧 compat 依赖 1.20.1，仅编译独立目录中的中性存根。
			def stubSource = rootProject.file('compat-stubs/src/main/java').toPath().toAbsolutePath().normalize()
			exclude { FileTreeElement e ->
				e.relativePath.pathString.startsWith('rip/ysm/compat/') &&
					!e.file.toPath().toAbsolutePath().normalize().startsWith(stubSource)
			}
		}
		resources {
			srcDirs '../common/src/main/resources', 'src/main/resources'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
	include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

	// Night Config：自研轻量 TOML 配置层（ConfigSpec）的底层库
	implementation "com.electronwill.night-config:core:3.8.1"
	implementation "com.electronwill.night-config:toml:3.8.1"
	include "com.electronwill.night-config:core:3.8.1"
	include "com.electronwill.night-config:toml:3.8.1"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

processResources {
	// Gradle 9 起，同一源码集内出现重复资源条目会直接报错（旧版静默按顺序覆盖）。
	// 本模块的资源目录（common + fabric）本就无重名文件；显式声明保留以固定行为，
	// 避免将来目录布局变化时构建中断（与 P1 之前的实际产物一致）。
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xlint:none', '-nowarn', '-Xmaxerrs', '10000', '-Xmaxwarns', '10000'])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// P1 拆工程后，根工程的 build/ 不再被 main 源码集包含，但 loom 的 sourcesJar 会
// 把运行期依赖的源也塞进来（jars/*.jar 内的 fabric.mod.json 等同名文件可能重复）。
// 保持 Gradle 旧版“后者覆盖前者”的语义，避免 Gradle 9 直接中断构建。
tasks.named('sourcesJar') {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
	from(rootProject.file("LICENSE.txt")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_name
			from components.java
		}
	}
}
