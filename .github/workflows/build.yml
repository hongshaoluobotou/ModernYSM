name: Build and test

on:
  push:
    branches: ['port/26.3']
    paths-ignore: &meta-only
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [port/26.3]
    paths-ignore: *meta-only
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 的旧运行会被新推送取消，避免堆积（matrix 两平台都取消）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows 冷缓存下要下 Minecraft/loom 依赖，20 分钟偏紧
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Compile, test and package
        shell: bash
        run: bash ./gradlew build --no-daemon --console=plain --stacktrace
