// Forge 加载器模块（ForgeGradle 7 + Slime Launcher）。
// 共享源码仍放在 common/ 目录（保持 1.20.1 时代的目录结构），
// 这里只把 common + forge + compat-stubs 三个源码目录映射到本模块的 main 源码集。
plugins {
	// ForgeGradle 7 不会自动应用 java 插件（fabric-loom / moddev 会），必须显式声明
	id 'java'
	id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_name
}

sourceSets {
	main {
		java {
			srcDirs '../common/src/main/java', 'src/main/java',
					// compat 编译存根（真实现被排除期间使用，恢复 compat 时删除此行）
					'../compat-stubs/src/main/java'
			// relativePath 使用 Gradle 的统一分隔符；不要用平台相关的 absolutePath 字符串。
			def stubSource = rootProject.file('compat-stubs/src/main/java').toPath().toAbsolutePath().normalize()
			exclude { FileTreeElement e ->
				e.relativePath.pathString.startsWith('rip/ysm/compat/') &&
					!e.file.toPath().toAbsolutePath().normalize().startsWith(stubSource)
			}
		}
		resources {
			srcDirs '../common/src/main/resources', 'src/main/resources'
		}
		// FG7 dev 的坑：Slime Launcher 把类路径上的每个“目录”当成一个独立 mod 文件，
		// FML 只在含 META-INF/mods.toml 的那个目录里找 @Mod 类 → classes 与 resources
		// 必须落在同一目录，否则启动报 “constructed 0 mods … but had 1 mods specified”。
		// 该设置只影响 dev 运行目录，jar 产物不受影响。
		output.resourcesDir = file("$buildDir/classes/java/main")
	}
}

minecraft {
	runs {
		register('client') {
			mods {
				yes_steve_model {
					source sourceSets.main
				}
			}
		}
		register('server') {
			mods {
				yes_steve_model {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

// ForgeGradle 7 没有 jarJar 支持（NeoForge 的 ModDevGradle 才有），这里手工生成
// Forge 的 JarJar 需要的两个东西：内嵌 jar（META-INF/jarjar/）+ META-INF/jarjar/metadata.json。
// 格式取自 Forge 自带的 mixinextras-forge（见其 META-INF/jarjar/metadata.json）。
configurations {
	jarJarEmbedded {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${project.forge_version}")

	implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
	// 运行期需要但 Forge 不自带的库 → 内嵌进 jar（JarJar：META-INF/jarjar/*.jar + metadata.json）。
	// 注意：服务端也用（YSMFolderDeserializer 解析 .ysm 包内 AVIF/WEBP 贴图），不是纯客户端依赖。
	jarJarEmbedded "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

	// Night Config：Forge 自带 3.7.4（ConfigSpec 的底层 TOML 库），不再声明版本避免两份实现
}

def jarJarOutputDir = layout.buildDirectory.dir('generated/jarjar')

def generateJarJarMetadata = tasks.register('generateJarJarMetadata') {
	inputs.files(configurations.jarJarEmbedded)
	outputs.dir(jarJarOutputDir)
	doLast {
		def jars = configurations.jarJarEmbedded.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
			def id = artifact.moduleVersion.id
			[
					identifier: [group: id.group, artifact: id.name],
					version   : [range: "[${id.version},)".toString(), artifactVersion: id.version],
					path      : "META-INF/jarjar/${artifact.file.name}",
					isObfuscated: false
			]
		}
		// 目录结构必须与 jar 内的目标路径一致（from(目录) 会保留相对路径）
		def file = jarJarOutputDir.get().dir('META-INF/jarjar/metadata.json').asFile
		file.parentFile.mkdirs()
		file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: jars]))
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/mods.toml") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xlint:none', '-nowarn', '-Xmaxerrs', '10000', '-Xmaxwarns', '10000'])
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('jar', Jar) {
	// Forge 的 mixin 配置走 mod 文件（jar 或 dev 的源码集输出目录）的 MANIFEST.MF 的
	// MixinConfigs 属性。dev 目录用的清单见 src/main/resources/META-INF/MANIFEST.MF
	// （processResources 把它复制进 classes/java/main，Slime Launcher 把该目录当 mod 文件，
	// 其 SecureJar 会读取目录里的 MANIFEST.MF）；打包成 jar 时用下面这份任务清单，
	// 并排除资源里那份，避免同名条目重复。
	exclude 'META-INF/MANIFEST.MF'
	manifest {
		attributes('MixinConfigs': 'yes_steve_model.mixins.json,yes_steve_model_pip.mixins.json,yes_steve_model_forge.mixins.json')
	}
	// JarJar：内嵌第三方库 + 元数据（不加上面这个，装进真实 Forge 客户端时会 NoClassDefFoundError）
	from(configurations.jarJarEmbedded) {
		into 'META-INF/jarjar'
	}
	dependsOn(generateJarJarMetadata)
	from(jarJarOutputDir)
	from(rootProject.file("LICENSE.txt")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
