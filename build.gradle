// 根工程：只负责各加载器模块共用的仓库声明。
// 每个加载器有独立子工程（fabric / neoforge / forge），共享源码仍在 common/ 目录。
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

repositories {
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
		content {
			includeGroup "com.github.OpenYSM"
			includeGroup "com.github.TartaricAlkaline"
		}
	}
	maven {
		name = "Ladysnake"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		name = "NeoForged"
		url = "https://maven.neoforged.net/releases"
	}
	flatDir {
		dirs rootProject.file('libs')
	}
}

subprojects {
	repositories {
		maven {
			name = "JitPack"
			url = "https://jitpack.io"
			content {
				includeGroup "com.github.OpenYSM"
				includeGroup "com.github.TartaricAlkaline"
			}
		}
		maven {
			name = "Ladysnake"
			url = "https://maven.ladysnake.org/releases"
		}
		flatDir {
			dirs rootProject.file('libs')
		}
	}
}
