plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_name
}

repositories {
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
		content {
			includeGroup "com.github.OpenYSM"
			includeGroup "com.github.TartaricAlkaline"
		}
	}
	maven {
		name = "Ladysnake"
		url = "https://maven.ladysnake.org/releases"
	}
	flatDir {
		dirs rootProject.file('libs')
	}
}

loom {
	mods {
		"yes_steve_model" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs 'common/src/main/java', 'fabric/src/main/java',
					// compat 编译存根（真实现被排除期间使用，恢复 compat 时删除此行）
					'compat-stubs/src/main/java'
			// compat 依赖 1.20.1 的 libs jar，移植期间整体排除，按需恢复（只排除真实现目录，保留 compat-stubs）
			exclude { FileTreeElement e ->
				e.file.absolutePath.contains('/rip/ysm/compat/') && !e.file.absolutePath.contains('compat-stubs')
			}
			// TODO port: 渲染管线迁移（26.3 EntityRenderState + SubmitNodeCollector 体系）。
			// 渲染管线原生适配阶段①：rip/ysm/gpu 的 native GPU/SIMD 路径文件已物理删除，
			// 仅剩在用的 BlurStack/Pie/PieElementRenderState（GuiRenderState 适配层），无需排除。
			exclude { FileTreeElement e ->
				def p = e.file.absolutePath
				p.contains('/rip/ysm/compat/') && !p.contains('compat-stubs') ||
				// ExtraPlayerOverlay/HudOverlay 已恢复（26.3 HudElement 体系，HudOverlay 接口已删）；
				// 死 mixin 文件已于阶段④（2026.09.27）物理删除——见 yes_steve_model.mixins.json 阶段④注册表。
				false
			}
		}
		resources {
			srcDirs 'common/src/main/resources', 'fabric/src/main/resources'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
	include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

	// Night Config：自研轻量 TOML 配置层（ConfigSpec）的底层库
	implementation "com.electronwill.night-config:core:3.8.1"
	implementation "com.electronwill.night-config:toml:3.8.1"
	include "com.electronwill.night-config:core:3.8.1"
	include "com.electronwill.night-config:toml:3.8.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xlint:none', '-nowarn', '-Xmaxerrs', '10000', '-Xmaxwarns', '10000'])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE.txt") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_name
			from components.java
		}
	}
}
