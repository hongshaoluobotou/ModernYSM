plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_name
}

repositories {
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
		content {
			includeGroup "com.github.OpenYSM"
			includeGroup "com.github.TartaricAlkaline"
		}
	}
	maven {
		name = "Ladysnake"
		url = "https://maven.ladysnake.org/releases"
	}
	flatDir {
		dirs rootProject.file('libs')
	}
}

loom {
	mods {
		"yes_steve_model" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs 'common/src/main/java', 'fabric/src/main/java',
					// compat 编译存根（真实现被排除期间使用，恢复 compat 时删除此行）
					'compat-stubs/src/main/java'
			// compat 依赖 1.20.1 的 libs jar，移植期间整体排除，按需恢复（只排除真实现目录，保留 compat-stubs）
			exclude { FileTreeElement e ->
				e.file.absolutePath.contains('/rip/ysm/compat/') && !e.file.absolutePath.contains('compat-stubs')
			}
			// TODO port: 渲染管线（MultiBufferSource/GuiGraphics/MultiBufferSource→submit/GpuBuffer）尚未迁移，以下渲染相关文件暂排除编译，逐个恢复
			exclude { FileTreeElement e ->
				def p = e.file.absolutePath
				p.contains('/client/renderer/') || p.contains('/rip/ysm/gpu/') ||
				p.contains('/client/gui/') || p.contains('/rip/ysm/gui/') || p.contains('/geckolib3/geo/') ||
				p.endsWith('/OuterFileTexture.java') ||
				p.endsWith('/RenderFirstPlayerBackground.java') || p.endsWith('/ReplacePlayerHandRenderEvent.java') ||
				p.endsWith('/ReplacePlayerRenderEvent.java') || p.endsWith('/PlayerSkinTextureManager.java') ||
				p.endsWith('/HudOverlay.java') ||
				p.endsWith('/BufferSourceMixin.java') || p.endsWith('/BufferBuilderMixin.java') ||
				p.endsWith('/EntityRenderDispatcherMixin.java') || p.endsWith('/LivingRendererMixin.java') ||
				p.endsWith('/WorldRendererMixin.java') || p.endsWith('/InventoryScreenMixin.java') ||
				p.endsWith('/PlayerRendererMixin.java') || p.endsWith('/PlayerRendererHandMixin.java') ||
				p.endsWith('/LivingEntityRendererAccessor.java') || p.endsWith('/RenderUtils.java') ||
				p.endsWith('/AnimationDebugOverlay.java') || p.endsWith('/ExtraPlayerOverlay.java') || p.endsWith('/ModelSyncStateOverlay.java') ||
				// 以下文件依赖上面被排除的渲染类（OuterFileTexture / geckolib3.geo / client.gui），随渲染迁移一起恢复
				p.endsWith('/YSMClientMapper.java') || p.endsWith('/ClientModelManager.java') ||
				p.endsWith('/ModelAssemblyFactory.java') || p.endsWith('/JsonTextureUtils.java') ||
				p.endsWith('/AnimatableEntity.java') || p.endsWith('/WatchCommand.java') || p.endsWith('/MoLangCommand.java') ||
				p.endsWith('/ModelProperties.java') || p.endsWith('/ModelPackData.java') ||
				p.endsWith('/VehicleModelFiles.java') || p.endsWith('/ProjectileModelFiles.java') ||
				p.endsWith('/PlayerModelBundle.java') || p.endsWith('/MainModelData.java') || p.endsWith('/ModelAssembly.java') ||
				p.endsWith('/PlayerModelToggleKey.java') || p.endsWith('/AnimationRouletteKey.java') || p.endsWith('/DebugAnimationKey.java') ||
				p.endsWith('/LivingAnimatable.java') || p.endsWith('/GeoEntity.java') || p.endsWith('/PlayerGeoEntity.java') ||
				p.endsWith('/ClientModelInfo.java') || p.endsWith('/CameraUtil.java') || p.endsWith('/AnimationProcessor.java') ||
				p.endsWith('/VehicleModelBundle.java') || p.endsWith('/ProjectileModelBundle.java') ||
				p.endsWith('/ModScreenEvent.java') || p.endsWith('/GeckoVehicleEntity.java') || p.endsWith('/GeckoProjectileEntity.java') ||
				p.endsWith('/PlayerCapability.java') || p.endsWith('/YsmEventBootstrap.java') ||
				p.endsWith('/CustomPlayerEntity.java') || p.endsWith('/PlayerPreviewEntity.java') ||
				p.endsWith('/FirstPersonArmAnimationController.java') || p.endsWith('/VehicleAnimationController.java') ||
				p.endsWith('/ProjectileAnimationController.java') || p.endsWith('/PlayerAnimationController.java') ||
				p.endsWith('/ExtraAnimationKey.java') || p.endsWith('/AnimationContext.java') ||
				p.endsWith('/LivingMovementAnimationPredicate.java') || p.endsWith('/ArmorSlotProcessor.java') ||
				p.endsWith('/ClientSetupEvent.java') || p.endsWith('/EntityRenderCache.java') || p.endsWith('/CtrlBinding.java') ||
				p.endsWith('/VehicleCapability.java') || p.endsWith('/ProjectileCapability.java') ||
				p.endsWith('/ClientTickEvent.java') || p.endsWith('/MainHandHoldPredicate.java') ||
				p.endsWith('/IAnimationPredicate.java') || p.endsWith('/CommandRegistry.java') ||
				p.endsWith('/InteractionHandAnimationPredicate.java') || p.endsWith('/PlayerCapabilityClientStore.java') ||
				p.endsWith('/S2CVersionCheckPacket.java') || p.endsWith('/ServerModelInfo.java') ||
				p.endsWith('/AnimationControllerInstance.java') || p.endsWith('/AnimationControllerContext.java') ||
				p.endsWith('/ClientPlayerJoinNotification.java') ||
				p.endsWith('/SlashBladeRenderer.java') || p.endsWith('/TouhouLittleMaidCompat.java') || p.endsWith('/TouhouMaidBoneProcessor.java')
			}
		}
		resources {
			srcDirs 'common/src/main/resources', 'fabric/src/main/resources'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
	include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

	// Night Config：自研轻量 TOML 配置层（ConfigSpec）的底层库
	implementation "com.electronwill.night-config:core:3.8.1"
	implementation "com.electronwill.night-config:toml:3.8.1"
	include "com.electronwill.night-config:core:3.8.1"
	include "com.electronwill.night-config:toml:3.8.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xlint:none', '-nowarn', '-Xmaxerrs', '10000', '-Xmaxwarns', '10000'])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE.txt") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_name
			from components.java
		}
	}
}
