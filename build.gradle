plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_name
}

repositories {
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
		content {
			includeGroup "com.github.OpenYSM"
			includeGroup "com.github.TartaricAlkaline"
		}
	}
	maven {
		name = "Ladysnake"
		url = "https://maven.ladysnake.org/releases"
	}
	flatDir {
		dirs rootProject.file('libs')
	}
}

loom {
	mods {
		"yes_steve_model" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs 'common/src/main/java', 'fabric/src/main/java',
					// compat 编译存根（真实现被排除期间使用，恢复 compat 时删除此行）
					'compat-stubs/src/main/java'
			// compat 依赖 1.20.1 的 libs jar，移植期间整体排除，按需恢复（只排除真实现目录，保留 compat-stubs）
			exclude { FileTreeElement e ->
				e.file.absolutePath.contains('/rip/ysm/compat/') && !e.file.absolutePath.contains('compat-stubs')
			}
			// TODO port: 渲染管线（MultiBufferSource/GuiGraphics/MultiBufferSource→submit/GpuBuffer）尚未迁移，以下渲染相关文件暂排除编译，逐个恢复
			exclude { FileTreeElement e ->
				def p = e.file.absolutePath
				p.contains('/client/renderer/') || p.contains('/rip/ysm/gpu/') ||
				p.contains('/client/gui/') && !p.contains('/client/gui/custom') && !p.contains('/client/gui/metadata')
					&& !p.endsWith('/client/gui/IGuiWidget.java') && !p.endsWith('/client/gui/ModelMetadataPresenter.java') ||
				p.contains('/rip/ysm/gui/') ||
				(p.contains('/geckolib3/geo/') && !(p.contains('/geckolib3/geo/render') || p.contains('/geckolib3/geo/animated'))) ||
				// OuterFileTexture 已按 26.3 GpuTexture API 重写
				// 依赖 OuterFileTexture/geckolib3.geo 的文件暂继续排除
				p.endsWith('/RenderFirstPlayerBackground.java') || p.endsWith('/ReplacePlayerHandRenderEvent.java') ||
				p.endsWith('/ReplacePlayerRenderEvent.java') || p.endsWith('/PlayerSkinTextureManager.java') ||
				p.endsWith('/HudOverlay.java') ||
				p.endsWith('/BufferSourceMixin.java') || p.endsWith('/BufferBuilderMixin.java') ||
				p.endsWith('/EntityRenderDispatcherMixin.java') || p.endsWith('/LivingRendererMixin.java') ||
				p.endsWith('/WorldRendererMixin.java') || p.endsWith('/InventoryScreenMixin.java') ||
				p.endsWith('/PlayerRendererMixin.java') || p.endsWith('/PlayerRendererHandMixin.java') ||
				p.endsWith('/LivingEntityRendererAccessor.java') || p.endsWith('/RenderUtils.java') ||
				p.endsWith('/AnimationDebugOverlay.java') || p.endsWith('/ExtraPlayerOverlay.java') || p.endsWith('/ModelSyncStateOverlay.java') ||
				// 以下文件依赖上面被排除的渲染类（client.renderer 的 AnimationDebugOverlay /
				// ModelPreviewRenderer / RendererManager 等，或 client.gui 完整屏幕类），随渲染层迁移一起恢复
				p.endsWith('/WatchCommand.java') || p.endsWith('/MoLangCommand.java') ||
				p.endsWith('/DebugCommand.java') || p.endsWith('/RootClientCommand.java') ||
				p.endsWith('/ModScreenEvent.java') ||
				p.endsWith('/AnimationRouletteKey.java') || p.endsWith('/PlayerModelToggleKey.java') ||
				p.endsWith('/ExtraAnimationKey.java') || p.endsWith('/DebugAnimationKey.java') ||
				p.endsWith('/ExtraPlayerRenderKey.java') || p.endsWith('/PauseScreenMixin.java') ||
				// TouhouLittleMaidCompat / TouhouMaidBoneProcessor 由 rip/ysm/compat 目录级排除（stub 在 compat-stubs 中提供）
				p.endsWith('/SlashBladeRenderer.java')
			}
		}
		resources {
			srcDirs 'common/src/main/resources', 'fabric/src/main/resources'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
	include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

	// Night Config：自研轻量 TOML 配置层（ConfigSpec）的底层库
	implementation "com.electronwill.night-config:core:3.8.1"
	implementation "com.electronwill.night-config:toml:3.8.1"
	include "com.electronwill.night-config:core:3.8.1"
	include "com.electronwill.night-config:toml:3.8.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xlint:none', '-nowarn', '-Xmaxerrs', '10000', '-Xmaxwarns', '10000'])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE.txt") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_name
			from components.java
		}
	}
}
